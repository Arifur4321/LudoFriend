<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Background pattern">
  <defs>
    <linearGradient id="bp_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A4CE0"/>
      <stop offset="1" stop-color="#8E6BFF"/>
    </linearGradient>
    <!-- seamless tile: pawns + dots + diamonds on a 120 grid -->
    <pattern id="bp_tile" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- tiny pawn glyph -->
      <g fill="#FFFFFF" opacity="0.06">
        <path d="M30 26 C36 26 40 30 40 35 C40 40 35 41 33 46 L27 46 C25 41 20 40 20 35 C20 30 24 26 30 26 Z"/>
        <path d="M90 86 C96 86 100 90 100 95 C100 100 95 101 93 106 L87 106 C85 101 80 100 80 95 C80 90 84 86 90 86 Z"/>
      </g>
      <!-- dots -->
      <circle cx="90" cy="30" r="5" fill="#FFFFFF" opacity="0.07"/>
      <circle cx="30" cy="90" r="5" fill="#FFFFFF" opacity="0.07"/>
      <circle cx="60" cy="60" r="3" fill="#FFC542" opacity="0.10"/>
      <!-- small diamonds -->
      <rect x="0" y="0" width="9" height="9" rx="2" fill="#FFFFFF" opacity="0.05" transform="rotate(45 4.5 4.5)"/>
      <rect x="115" y="115" width="9" height="9" rx="2" fill="#FFFFFF" opacity="0.05" transform="rotate(45 119.5 119.5)"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="240" height="240" fill="url(#bp_bg)"/>
  <rect x="0" y="0" width="240" height="240" fill="url(#bp_tile)"/>
</svg>
