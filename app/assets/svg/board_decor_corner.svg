<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Board corner flourish">
  <!-- intended for top-left corner; rotate/flip for others -->
  <!-- outer rounded frame corner -->
  <path d="M16 110 L16 40 C16 26 26 16 40 16 L110 16" fill="none" stroke="#5B3FD6" stroke-width="6" stroke-linecap="round"/>
  <path d="M26 110 L26 42 C26 33 33 26 42 26 L110 26" fill="none" stroke="#FFC542" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- corner emblem: small pawn + dots -->
  <g transform="translate(42 42)">
    <circle cx="0" cy="-4" r="8" fill="#FF6B6B"/>
    <path d="M-9 13 C-9 3 -4 0 0 0 C4 0 9 3 9 13 Z" fill="#FF6B6B"/>
    <circle cx="-3" cy="-6" r="2.4" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- decorative dots fanning out -->
  <circle cx="74" cy="20" r="3.5" fill="#2BD9A1"/>
  <circle cx="92" cy="20" r="3.5" fill="#FFB23E"/>
  <circle cx="20" cy="74" r="3.5" fill="#3A86FF"/>
  <circle cx="20" cy="92" r="3.5" fill="#8E6BFF"/>
  <!-- small leaf swirl -->
  <path d="M60 60 C72 56 84 60 92 72 C82 70 72 70 60 60 Z" fill="#8E6BFF" opacity="0.35"/>
</svg>
