<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Game room">
  <defs>
    <linearGradient id="rm_g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E6BFF"/>
      <stop offset="1" stop-color="#5B3FD6"/>
    </linearGradient>
  </defs>
  <!-- door/room frame -->
  <rect x="14" y="12" width="36" height="40" rx="8" fill="url(#rm_g)" stroke="#3F2BA8" stroke-width="2.5"/>
  <rect x="20" y="18" width="24" height="28" rx="5" fill="#FFF7EC" opacity="0.18"/>
  <!-- four player dots representing a room -->
  <circle cx="26" cy="26" r="4.5" fill="#FF5A5F"/>
  <circle cx="38" cy="26" r="4.5" fill="#2BD9A1"/>
  <circle cx="26" cy="38" r="4.5" fill="#FFB23E"/>
  <circle cx="38" cy="38" r="4.5" fill="#3A86FF"/>
  <!-- handle accent -->
  <circle cx="32" cy="55" r="3" fill="#FFC542"/>
</svg>
