name: ludo_friends
description: "Ludo Friends — an original animated online/offline multiplayer Ludo game."
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # On-device SQLite cache (last-known coins, free-spin timer, selected board).
  sqflite: ^2.3.3
  path: ^1.9.0

  # Rendering / assets
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  google_fonts: ^6.2.1

  # Realtime (Phase 2) — clean WebSocket client speaking the Pusher/Reverb
  # protocol (Reverb / Soketi / Laravel WebSockets compatible).
  web_socket_channel: ^3.0.1

  # Audio
  audioplayers: ^6.1.0

  # Utils — `intl: any` defers to the version flutter_localizations pins.
  intl: any
  flutter_facebook_auth: ^7.1.5
  google_sign_in: ^7.2.0
  share_plus: ^12.0.2
  # Opens the public legal pages (privacy / terms / data deletion) in a browser.
  url_launcher: ^6.3.1
  # Shows the running version + build number on the home screen, so testers can
  # instantly confirm which binary is installed.
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true # enables gen_l10n from lib/l10n/*.arb
  assets:
    - assets/svg/
    - assets/images/
    - assets/animations/
    - assets/sfx/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#6A4CE0"
  adaptive_icon_foreground: assets/images/app_icon.png
